spring.application.name=conectaco

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/conectaco_completo

# El usuario y la contrasena de MySQL van en application-local.properties (ver README)
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Usar los nombres de tablas/columnas tal cual estan en el script SQL
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
